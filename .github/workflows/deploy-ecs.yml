name: Deploy ECS (prod)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Serviço(s) a publicar"
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - worker
  push:
    branches:
      - developer

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ecs-prod
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "495219734037"
  ECR_REGISTRY: 495219734037.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY_WEB: orya-web
  ECR_REPOSITORY_WORKER: orya-worker
  ECS_CLUSTER: orya-prod
  ECS_SERVICE_WEB: orya-prod-web
  ECS_SERVICE_WORKER: orya-prod-worker
  DIRECT_URL: postgresql://user:pass@localhost:5432/postgres
  DATABASE_URL: postgresql://user:pass@localhost:5432/postgres

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve deploy target
        id: resolve_target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
          else
            target="all"
          fi
          echo "DEPLOY_TARGET=${target}" >> "$GITHUB_ENV"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Validate AWS auth config
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Configure o secret AWS_ROLE_TO_ASSUME para OIDC." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy-ecs

      - name: Load public env for web build
        run: |
          set -euo pipefail
          SECRET_ID="orya/prod/supabase"
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)
          NEXT_PUBLIC_SUPABASE_URL=$(echo "$SECRET_JSON" | jq -r '.NEXT_PUBLIC_SUPABASE_URL')
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$SECRET_JSON" | jq -r '.NEXT_PUBLIC_SUPABASE_ANON_KEY')
          if [[ -z "$NEXT_PUBLIC_SUPABASE_URL" || "$NEXT_PUBLIC_SUPABASE_URL" == "null" ]]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL in $SECRET_ID" >&2
            exit 1
          fi
          if [[ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || "$NEXT_PUBLIC_SUPABASE_ANON_KEY" == "null" ]]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY in $SECRET_ID" >&2
            exit 1
          fi
          echo "::add-mask::$NEXT_PUBLIC_SUPABASE_URL"
          echo "::add-mask::$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push web image
        id: build_web
        if: ${{ steps.resolve_target.outputs.target == 'all' || steps.resolve_target.outputs.target == 'web' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_WEB }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_WEB }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=orya-web
          cache-to: type=gha,scope=orya-web,mode=max
          provenance: false

      - name: Build & push worker image
        id: build_worker
        if: ${{ steps.resolve_target.outputs.target == 'all' || steps.resolve_target.outputs.target == 'worker' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_WORKER }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_WORKER }}:latest
          cache-from: type=gha,scope=orya-worker
          cache-to: type=gha,scope=orya-worker,mode=max
          provenance: false

      - name: Run DB migrations via ECS task
        if: ${{ steps.resolve_target.outputs.target == 'all' || steps.resolve_target.outputs.target == 'web' }}
        env:
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ -z "${WEB_DIGEST}" ]]; then
            echo "WEB_DIGEST vazio; build web falhou." >&2
            exit 1
          fi

          current_td=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_WEB}" --query "services[0].taskDefinition" --output text)
          aws ecs describe-task-definition --task-definition "${current_td}" --query taskDefinition --output json > /tmp/migrate-base.json

          jq --arg img "${ECR_REGISTRY}/${ECR_REPOSITORY_WEB}@${WEB_DIGEST}" '
            .containerDefinitions |= map(
              if .name == "orya-web" then
                .image = $img
                | .command = ["sh","-lc","npx prisma migrate deploy --schema=prisma/schema.prisma"]
              else . end
            )
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
            | walk(if type=="object" then with_entries(select(.value != null)) else . end)
          ' /tmp/migrate-base.json > /tmp/migrate-task.json

          migrate_td=$(aws ecs register-task-definition --cli-input-json file:///tmp/migrate-task.json --query "taskDefinition.taskDefinitionArn" --output text)

          subnets=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_WEB}" --query "services[0].networkConfiguration.awsvpcConfiguration.subnets" --output text | tr '\t' ',')
          sgs=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_WEB}" --query "services[0].networkConfiguration.awsvpcConfiguration.securityGroups" --output text | tr '\t' ',')
          assign_public_ip=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE_WEB}" --query "services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp" --output text)

          task_arn=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${migrate_td}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${subnets}],securityGroups=[${sgs}],assignPublicIp=${assign_public_ip}}" \
            --query "tasks[0].taskArn" \
            --output text)

          echo "migration task: ${task_arn}"
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${task_arn}"

          exit_code=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${task_arn}" --query "tasks[0].containers[?name=='orya-web']|[0].exitCode" --output text)
          if [[ "${exit_code}" != "0" ]]; then
            reason=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${task_arn}" --query "tasks[0].stoppedReason" --output text)
            echo "Migration task failed (exit=${exit_code}): ${reason}" >&2
            exit 1
          fi

      - name: Roll out task definitions by image digest
        env:
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.build_worker.outputs.digest }}
        run: |
          set -euo pipefail

          update_service_with_digest() {
            local service_name="$1"
            local container_name="$2"
            local image_ref="$3"
            local current_td new_td

            current_td=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${service_name}" --query "services[0].taskDefinition" --output text)
            aws ecs describe-task-definition --task-definition "${current_td}" --query taskDefinition --output json > "/tmp/${service_name}-base.json"

            jq --arg img "${image_ref}" --arg cname "${container_name}" '
              .containerDefinitions |= map(if .name == $cname then .image = $img else . end)
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
              | walk(if type=="object" then with_entries(select(.value != null)) else . end)
            ' "/tmp/${service_name}-base.json" > "/tmp/${service_name}-new.json"

            new_td=$(aws ecs register-task-definition --cli-input-json "file:///tmp/${service_name}-new.json" --query "taskDefinition.taskDefinitionArn" --output text)
            aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${service_name}" --task-definition "${new_td}" >/dev/null
            echo "${service_name} -> ${new_td}"
          }

          services=()

          if [[ "${DEPLOY_TARGET}" == "all" || "${DEPLOY_TARGET}" == "web" ]]; then
            if [[ -z "${WEB_DIGEST}" ]]; then
              echo "WEB_DIGEST vazio; build web falhou." >&2
              exit 1
            fi
            update_service_with_digest "${ECS_SERVICE_WEB}" "orya-web" "${ECR_REGISTRY}/${ECR_REPOSITORY_WEB}@${WEB_DIGEST}"
            services+=("${ECS_SERVICE_WEB}")
          fi

          if [[ "${DEPLOY_TARGET}" == "all" || "${DEPLOY_TARGET}" == "worker" ]]; then
            if [[ -z "${WORKER_DIGEST}" ]]; then
              echo "WORKER_DIGEST vazio; build worker falhou." >&2
              exit 1
            fi
            update_service_with_digest "${ECS_SERVICE_WORKER}" "orya-worker" "${ECR_REGISTRY}/${ECR_REPOSITORY_WORKER}@${WORKER_DIGEST}"
            services+=("${ECS_SERVICE_WORKER}")
          fi

          wait_for_service_stable() {
            local service_name="$1"
            local max_attempts=90
            local sleep_seconds=20
            local attempt=0

            while true; do
              state_json=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${service_name}" --output json)
              desired=$(echo "${state_json}" | jq -r '.services[0].desiredCount // 0')
              running=$(echo "${state_json}" | jq -r '.services[0].runningCount // 0')
              pending=$(echo "${state_json}" | jq -r '.services[0].pendingCount // 0')
              active_rollouts=$(echo "${state_json}" | jq -r '[.services[0].deployments[]? | select(.rolloutState != "COMPLETED")] | length')

              if [[ "${running}" == "${desired}" && "${pending}" == "0" && "${active_rollouts}" == "0" ]]; then
                echo "${service_name} reached steady state (running=${running}, desired=${desired})."
                return 0
              fi

              attempt=$((attempt + 1))
              if (( attempt >= max_attempts )); then
                echo "Timed out waiting for ${service_name} to stabilize." >&2
                echo "Latest ECS events for ${service_name}:" >&2
                echo "${state_json}" | jq -r '.services[0].events[0:10][]?.message' >&2 || true
                return 1
              fi

              echo "Waiting ${service_name}: running=${running}, desired=${desired}, pending=${pending}, activeRollouts=${active_rollouts} (attempt ${attempt}/${max_attempts})"
              sleep "${sleep_seconds}"
            done
          }

          for svc in "${services[@]}"; do
            wait_for_service_stable "${svc}"
          done

      - name: Smoke check public site
        if: ${{ steps.resolve_target.outputs.target == 'all' || steps.resolve_target.outputs.target == 'web' }}
        run: |
          curl -fsS https://orya.pt/ >/dev/null
