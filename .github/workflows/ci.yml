name: ci

on:
  pull_request:
  push:
    branches: ["developer", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
      PRISMA_GENERATE_NO_ENGINE: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run gate:scripts-ops
      - run: npm run gate:scripts-catalog
      - run: npm run gate:test-hygiene
      - run: env -i PATH="$PATH" NODE_ENV=test DATABASE_URL="$DATABASE_URL" DIRECT_URL="$DIRECT_URL" PRISMA_GENERATE_NO_ENGINE="$PRISMA_GENERATE_NO_ENGINE" NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" npm run build
      - run: env -i PATH="$PATH" NODE_ENV=test DATABASE_URL="$DATABASE_URL" DIRECT_URL="$DIRECT_URL" PRISMA_GENERATE_NO_ENGINE="$PRISMA_GENERATE_NO_ENGINE" NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" npx vitest run
      - run: npm run db:gates:offline
